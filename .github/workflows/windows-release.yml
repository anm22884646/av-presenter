name: Windows testing release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: windows-testing-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile and test
        run: npm test
      - name: Package Windows x64
        run: npx electron-builder --win --x64 --dir --publish never
      - name: Create download archives
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force downloads | Out-Null
          Copy-Item README.md,WINDOWS-VALIDATION.md release/win-unpacked/
          Compress-Archive -Path release/win-unpacked -DestinationPath "downloads/AV-Presenter-Windows-x64-$version.zip"
          git archive --format=zip --output="downloads/AV-Presenter-Source-$version.zip" HEAD
          $lines = Get-ChildItem downloads/*.zip | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $lines | Set-Content downloads/SHA256SUMS.txt
      - name: Keep workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AV-Presenter-Windows-testing
          path: downloads/*
      - name: Publish testing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title "AV Presenter $env:APP_VERSION - Windows testing" --notes-file "release-notes/av-presenter-v$env:APP_VERSION.md"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release' }
          }
          gh release upload $tag downloads/*.zip downloads/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets' }
